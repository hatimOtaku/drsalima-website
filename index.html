<script>
(function () {
  var grid = document.getElementById("svcGrid");
  window.SERVICES.forEach(function (s, i) {
    var a = document.createElement("a");
    a.className = "svc-card rv t" + (i + 1);
    a.href = "service.html?s=" + s.slug;
    a.innerHTML = '<span class="num">' + s.n + '</span><h3 data-svc="' + s.slug + '"></h3><span class="tag" data-tag="' + s.slug + '"></span>' +
      '<span class="more"><span data-i18n="svc.more"></span> <i>→</i></span>';
    grid.appendChild(a);
  });
  function fill() {
    var l = DR.lang();
    document.querySelectorAll("[data-tag]").forEach(function (el) {
      var s = SERVICES.find(function (x) { return x.slug === el.dataset.tag; });
      el.textContent = s[l].tag;
    });
  }
  DR.applyLang();
  document.querySelectorAll(".svc-card").forEach(function (c) { DR.observe(c); });
  document.addEventListener("langchange", fill);
  fill();
  var v = document.getElementById("heroVideo");
  /* Hide the video (animated gradient shows instead) only if the last source fails to load */
  var last = v.querySelector("source:last-of-type");
  if (last) last.addEventListener("error", function () { v.style.display = "none"; });
})();
</script>
